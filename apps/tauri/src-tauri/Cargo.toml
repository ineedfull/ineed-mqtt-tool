[package]
name = "ineed-mqtt-tool"
version = "0.1.1"
description = "Ineed MQTT Tool desktop shell"
authors = ["Ineed"]
edition = "2021"
license = "Apache-2.0"
default-run = "ineed-mqtt-tool"

[features]
desktop-soak = []
release-signing = ["dep:minisign"]

[[bin]]
name = "desktop_soak_harness"
path = "src/bin/desktop_soak_harness.rs"
required-features = ["desktop-soak"]

[[bin]]
name = "update_signature"
path = "src/bin/update_signature.rs"
required-features = ["release-signing"]

[lib]
name = "ineed_mqtt_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
minisign = { version = "0.9", optional = true }
chrono = "0.4"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rumqttc = { version = "0.25", default-features = false, features = ["url", "websocket", "use-rustls-no-provider"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "=2.12.0"
updater-http = { package = "reqwest", version = "0.13", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
minisign = "0.9"
